name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race ./...
      - name: Build smoke check
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/dudu-probe ./cmd/dudu-probe

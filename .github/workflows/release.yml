name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_arch: amd64
          - goos: linux
            goarch: arm64
            asset_arch: arm64
          - goos: linux
            goarch: "386"
            asset_arch: "386"
          - goos: linux
            goarch: arm
            goarm: "6"
            asset_arch: arm
          - goos: linux
            goarch: mipsle
            asset_arch: mipsle
          - goos: darwin
            goarch: amd64
            asset_arch: amd64
          - goos: darwin
            goarch: arm64
            asset_arch: arm64
          - goos: windows
            goarch: amd64
            asset_arch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          archive_name="dudu-probe_${version}_${GOOS}_${ASSET_ARCH}"
          archive_dir="dist/${archive_name}"
          mkdir -p "$archive_dir"
          bin_name="dudu-probe"
          if [[ "$GOOS" == "windows" ]]; then
            bin_name="dudu-probe.exe"
          fi
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" GOARM="$GOARM" go build -trimpath \
            -ldflags="-s -w -X github.com/seakee/dudu-probe/internal/version.Version=${version} -X github.com/seakee/dudu-probe/internal/version.Commit=${commit} -X github.com/seakee/dudu-probe/internal/version.BuildDate=${build_date}" \
            -o "${archive_dir}/${bin_name}" ./cmd/dudu-probe
          cp README.md README.zh-CN.md LICENSE configs/config.example.json scripts/install.sh "$archive_dir/"
          tar -C dist -czf "dist/${archive_name}.tar.gz" "${archive_name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.asset_arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag dist/* --generate-notes --title "$GITHUB_REF_NAME"
  container:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate build metadata
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

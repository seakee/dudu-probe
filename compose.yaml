services:
  dudu-probe:
    image: ghcr.io/seakee/dudu-probe:latest
    container_name: dudu-probe
    restart: always
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host/root:ro
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      HOST_ROOT: /host/root
      DUDU_PROBE_SERVER: "${DUDU_PROBE_SERVER}"
      DUDU_PROBE_KEY: "${DUDU_PROBE_KEY}"
      DUDU_PROBE_SECRET: "${DUDU_PROBE_SECRET}"
      DUDU_PROBE_INTERVAL: "${DUDU_PROBE_INTERVAL:-10}"
